<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EbookMe</title>
<script>
  (function () {
    var t = localStorage.getItem('ebook:theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var fs = parseInt(localStorage.getItem('ebook:fontSize'), 10);
    if (fs >= 14 && fs <= 26) document.documentElement.style.setProperty('--reader-font', fs + 'px');
    var ff = localStorage.getItem('ebook:font:family');
    if (ff) {
      var fc = localStorage.getItem('ebook:font:css');
      if (fc) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = fc; document.head.appendChild(l); }
      document.documentElement.style.setProperty('--font-ui',
        "'" + ff + "', \"Noto Sans Thai\", \"Sarabun\", -apple-system, \"Segoe UI\", Roboto, sans-serif");
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>

<div class="read-progress" id="readProgress"></div>

<header class="topbar">
  <a class="btn" href="index.html" title="กลับชั้นหนังสือ">← <span class="btn-label">ชั้นหนังสือ</span></a>
  <span class="title" id="barTitle">กำลังโหลด…</span>
  <button class="btn" id="fontDown" title="ลดขนาดตัวอักษร" style="font-size:0.85rem">A−</button>
  <button class="btn" id="fontUp" title="เพิ่มขนาดตัวอักษร" style="font-size:1.15rem">A+</button>
  <button class="btn" id="fontBtn" title="เลือกฟอนต์">🔤<span class="btn-label"> ฟอนต์</span></button>
  <button class="btn" id="modeBtn" title="สลับโหมดอ่าน (พลิกหน้า/เลื่อนแนวตั้ง)">📄</button>
  <button class="btn btn-icon" id="themeBtn" title="เปลี่ยนธีม">🌙</button>
  <button class="btn" id="tocBtn" title="สารบัญ">☰</button>
</header>

<div class="font-pop" id="fontPop"></div>

<main class="reader-main">
  <article class="content" id="content">
    <div class="loading">กำลังโหลดเนื้อหา…</div>
  </article>
</main>

<nav class="bottombar">
  <button class="btn" id="prevBtn">‹ บทก่อนหน้า</button>
  <button class="btn chapter-pos" id="posBtn" style="font-weight:400"></button>
  <button class="btn" id="nextBtn">บทถัดไป ›</button>
</nav>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer">
  <header>
    <span>สารบัญ</span>
    <button class="btn" id="drawerClose">✕</button>
  </header>
  <ol id="tocList"></ol>
  <div class="drawer-foot">
    <label><input type="checkbox" id="modeToggle"> 📄 โหมดพลิกหน้าแบบ ebook (ปิด = เลื่อนอ่านแนวตั้ง)</label>
    <label><input type="checkbox" id="animToggle"> 📖 อนิเมชันตอนพลิก</label>
  </div>
</aside>

<script src="assets/marked.min.js"></script>
<script src="assets/catalog.js"></script>
<script>
const THEMES = ['light', 'sepia', 'dark'];
const THEME_ICON = { light: '☀️', sepia: '📖', dark: '🌙' };
const $ = id => document.getElementById(id);

history.scrollRestoration = 'manual';

const params = new URLSearchParams(location.search);
const bookId = params.get('book');
if (!bookId) location.replace('index.html');

let book = null;
let ch = 1;      // 1-based
let ready = false; // กันการบันทึกตำแหน่ง/นับจบบท ก่อนเนื้อหาโหลดเสร็จ

/* ---------- theme & font size ---------- */

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('ebook:theme', t);
  $('themeBtn').textContent = THEME_ICON[t];
  renderMermaid($('content')).then(() => relayout()); // แผนภาพต้องวาดใหม่ให้สีเข้ากับธีม
}
$('themeBtn').textContent = THEME_ICON[document.documentElement.dataset.theme] || '🌙';
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
});

function fontSize() {
  const v = parseInt(localStorage.getItem('ebook:fontSize'), 10);
  return (v >= 14 && v <= 26) ? v : 17;
}
function setFontSize(px) {
  px = Math.min(26, Math.max(14, px));
  localStorage.setItem('ebook:fontSize', px);
  document.documentElement.style.setProperty('--reader-font', px + 'px');
  relayout(); // จำนวนหน้าเปลี่ยนตามขนาดตัวอักษร
}
$('fontUp').addEventListener('click', () => setFontSize(fontSize() + 1));
$('fontDown').addEventListener('click', () => setFontSize(fontSize() - 1));

/* ---------- ฟอนต์อ่าน (Google Fonts โหลดเฉพาะตัวที่ใช้) ---------- */

const FONT_FALLBACK = '"Noto Sans Thai", "Sarabun", "Thonburi", -apple-system, "Segoe UI", Roboto, sans-serif';
const FONTS = [
  { id: 'system',    name: 'ค่าเริ่มต้นของเครื่อง', family: null },
  { id: 'sarabun',   name: 'Sarabun',           family: 'Sarabun',           gf: 'Sarabun:ital,wght@0,300;0,400;0,500;0,700;1,400' },
  { id: 'krub',      name: 'Krub',              family: 'Krub',              gf: 'Krub:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400' },
  { id: 'thasadith', name: 'Thasadith',         family: 'Thasadith',         gf: 'Thasadith:ital,wght@0,400;0,700;1,400' },
  { id: 'playpen',   name: 'Playpen Sans Thai', family: 'Playpen Sans Thai', gf: 'Playpen+Sans+Thai:wght@300..700' },
  { id: 'notoserif', name: 'Noto Serif Thai',   family: 'Noto Serif Thai',   gf: 'Noto+Serif+Thai:wght@400;500;700' },
];
const fontCssUrl = f => `https://fonts.googleapis.com/css2?family=${f.gf}&display=swap`;

function applyFont(id) {
  const f = FONTS.find(x => x.id === id) || FONTS[0];
  if (f.family) {
    loadAsset(fontCssUrl(f), true).catch(() => {});
    document.documentElement.style.setProperty('--font-ui', `'${f.family}', ${FONT_FALLBACK}`);
    localStorage.setItem('ebook:font', f.id);
    // เก็บ family+css url แยกไว้ ให้หน้าอื่น (index/upload) bootstrap ได้โดยไม่ต้องรู้จักลิสต์นี้
    localStorage.setItem('ebook:font:family', f.family);
    localStorage.setItem('ebook:font:css', fontCssUrl(f));
  } else {
    document.documentElement.style.removeProperty('--font-ui');
    localStorage.removeItem('ebook:font');
    localStorage.removeItem('ebook:font:family');
    localStorage.removeItem('ebook:font:css');
  }
  renderFontPop();
  relayout();
  document.fonts.ready.then(() => relayout()); // จัดหน้าอีกรอบเมื่อฟอนต์ดาวน์โหลดเสร็จจริง
}

function renderFontPop() {
  const cur = localStorage.getItem('ebook:font') || 'system';
  $('fontPop').innerHTML = FONTS.map(f => `
    <button type="button" data-id="${f.id}" class="${f.id === cur ? 'current' : ''}"
      ${f.family ? `style="font-family:'${f.family}', sans-serif"` : ''}>
      ${f.id === cur ? '✓ ' : ''}${f.name}</button>`).join('');
}

$('fontBtn').addEventListener('click', () => {
  const pop = $('fontPop');
  if (!pop.classList.contains('show')) {
    renderFontPop();
    // โหลดทุกฟอนต์ตอนเปิดเมนู เพื่อให้ตัวเลือกแต่ละอัน preview เป็นฟอนต์จริงของมัน
    FONTS.filter(f => f.gf).forEach(f => loadAsset(fontCssUrl(f), true).catch(() => {}));
  }
  pop.classList.toggle('show');
});
$('fontPop').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  applyFont(b.dataset.id);
  $('fontPop').classList.remove('show');
});
document.addEventListener('click', e => {
  if (!e.target.closest('#fontPop, #fontBtn')) $('fontPop').classList.remove('show');
});

/* ---------- drawer ---------- */

function toggleDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
}
$('tocBtn').addEventListener('click', () => toggleDrawer(true));
$('posBtn').addEventListener('click', () => toggleDrawer(true));
$('drawerClose').addEventListener('click', () => toggleDrawer(false));
$('drawerOverlay').addEventListener('click', () => toggleDrawer(false));

/* ---------- progress / bookmark helpers ---------- */

const keyPos = () => `ebook:pos:${bookId}:${ch}`;
const keyDone = () => `ebook:done:${bookId}`;

function doneSet() {
  try { return new Set(JSON.parse(localStorage.getItem(keyDone()) || '[]')); }
  catch { return new Set(); }
}
function markDone() {
  const s = doneSet();
  if (!s.has(ch)) {
    s.add(ch);
    localStorage.setItem(keyDone(), JSON.stringify([...s]));
  }
}

function scrollRatio() {
  const el = document.scrollingElement;
  const max = el.scrollHeight - el.clientHeight;
  return max <= 0 ? 1 : el.scrollTop / max;
}

let saveTimer = null;
function onScroll() {
  if (!ready || paged()) return; // โหมดพลิกหน้าไม่มี scroll — ตำแหน่งดูแลโดย setPage()
  const r = scrollRatio();
  $('readProgress').style.width = (r * 100) + '%';
  if (r >= 0.9) markDone();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => localStorage.setItem(keyPos(), r.toFixed(4)), 250);
}
addEventListener('scroll', onScroll, { passive: true });
addEventListener('pagehide', () => {
  if (ready) localStorage.setItem(keyPos(), (paged() ? pageRatio() : scrollRatio()).toFixed(4));
});

/* ---------- rendering ---------- */

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function chapterUrl(n) {
  return `reader.html?book=${encodeURIComponent(bookId)}&ch=${n}`;
}

/* ไฟล์จาก AI มักพก CSS ของตัวเองมาด้วย (<style>, style=, <font>, bgcolor)
   ซึ่งจะทับสีของธีมเรา — ล้างออกให้หมด เนื้อหาต้องใช้สไตล์ของ reader เท่านั้น */
function stripForeignStyles(root) {
  root.querySelectorAll('style, link, script, meta, title, base').forEach(el => el.remove());
  root.querySelectorAll('font').forEach(f => f.replaceWith(...f.childNodes));
  root.querySelectorAll('[style], [bgcolor], [color], [background]').forEach(el => {
    ['style', 'bgcolor', 'color', 'background'].forEach(a => el.removeAttribute(a));
  });
}

/* ---------- ตัวเสริมการแสดงผล (โหลดไลบรารีเฉพาะบทที่ต้องใช้) ---------- */

const loadedAssets = {};
function loadAsset(src, isCss) {
  if (!loadedAssets[src]) loadedAssets[src] = new Promise((resolve, reject) => {
    let el;
    if (isCss) { el = document.createElement('link'); el.rel = 'stylesheet'; el.href = src; }
    else { el = document.createElement('script'); el.src = src; }
    el.onload = resolve;
    el.onerror = () => reject(new Error('โหลด ' + src + ' ไม่สำเร็จ'));
    document.head.appendChild(el);
  });
  return loadedAssets[src];
}

/* สูตรคณิต: marked ชอบกิน _ ^ \ ในสูตร เลยต้องดึงสูตรออกมาเก็บก่อน parse
   (ใส่ placeholder เป็นอักขระ private-use แทน) แล้วค่อยให้ KaTeX วาดทีหลัง
   รองรับ $...$, $$...$$, \( \), \[ \] — ข้ามส่วนที่อยู่ใน code fence/inline code */
const M_OPEN = '\uE000', M_CLOSE = '\uE001'; // อักขระ private-use ไม่มีทางโผล่ในเนื้อหาจริง
function extractMath(src) {
  const found = [];
  const grab = (tex, display) => `${M_OPEN}${found.push({ tex, display }) - 1}${M_CLOSE}`;
  const mathify = txt => txt
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => grab(tex, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => grab(tex, true))
    .replace(/\\\((.+?)\\\)/g, (_, tex) => grab(tex, false))
    // inline $...$: ห้ามช่องว่างชิดขอบ และ $ ปิดต้องไม่ตามด้วยตัวเลข (กันราคาเงิน)
    .replace(/(?<![\\$\w])\$(?!\s)((?:\\.|[^$\n])+?)(?<![\s\\])\$(?!\d)/g, (_, tex) => grab(tex, false));

  /* ตรวจ code fence แบบรายบรรทัด — ใช้ regex กวาดทั้งไฟล์ไม่ได้ เพราะ ``` ที่โผล่
     ใน inline code (เช่นเซลล์ตารางสอน markdown) จะหลอกให้จับคู่ fence เพี้ยนทั้งไฟล์ */
  const out = [];
  let text = [];
  let inFence = false, closer = '';
  const flushText = () => {
    if (!text.length) return;
    // กัน inline code ก่อน (backtick เปิด-ปิดยาวเท่ากัน ตาม CommonMark) แล้วค่อยจับสูตรจากที่เหลือ
    const spans = [];
    const kept = text.join('\n').replace(/(?<!`)(`+)(?!`)([\s\S]*?)(?<!`)\1(?!`)/g,
      m => '\uE002' + (spans.push(m) - 1) + '\uE003');
    out.push(mathify(kept).replace(/\uE002(\d+)\uE003/g, (_, i) => spans[+i]));
    text = [];
  };
  for (const line of src.split('\n')) {
    const t = line.trim();
    if (!inFence && /^(`{3,}|~{3,})/.test(t)) {
      flushText();
      inFence = true;
      closer = t[0].repeat(3);
      out.push(line);
    } else if (inFence) {
      out.push(line);
      if (t.startsWith(closer)) inFence = false;
    } else {
      text.push(line);
    }
  }
  flushText();
  return { out: out.join('\n'), found };
}

async function renderMath(root, found) {
  if (!found.length) return;
  try {
    await Promise.all([
      loadAsset('assets/katex/katex.min.css', true),
      loadAsset('assets/katex/katex.min.js'),
    ]);
  } catch { return; }
  const splitter = new RegExp(`${M_OPEN}(\\d+)${M_CLOSE}`);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (walker.currentNode.nodeValue.includes(M_OPEN)) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const span = document.createElement('span');
    span.innerHTML = node.nodeValue.split(splitter).map((part, i) => {
      if (i % 2 === 0) return esc(part);
      const { tex, display } = found[+part];
      try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
      catch { return esc(tex); }
    }).join('');
    node.replaceWith(...span.childNodes);
  });
}

async function highlightCode(root) {
  const blocks = [...root.querySelectorAll('pre code')];
  if (!blocks.length) return;
  try { await loadAsset('assets/highlight.min.js'); } catch { return; }
  blocks.forEach(c => { try { hljs.highlightElement(c); } catch {} });
}

async function renderMermaid(root) {
  const boxes = [...root.querySelectorAll('.mermaid-box')];
  if (!boxes.length) return;
  try { await loadAsset('assets/mermaid.min.js'); } catch { return; }
  const dark = document.documentElement.dataset.theme === 'dark';
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', fontFamily: 'inherit' });
  for (const [i, box] of boxes.entries()) {
    const id = `mmd-${ch}-${i}-${(renderMermaid.n = (renderMermaid.n || 0) + 1)}`;
    try {
      const { svg } = await mermaid.render(id, box.dataset.src);
      box.innerHTML = svg;
    } catch (e) {
      document.getElementById('d' + id)?.remove(); // mermaid ทิ้ง element ค้างไว้ตอน parse พัง
      box.innerHTML = `<div class="content-error">วาดแผนภาพ mermaid ไม่สำเร็จ: ${esc(String(e.message || e))}</div>`;
    }
  }
}

/* ไฮไลต์คำค้น (มาจากหน้า search ผ่าน ?q=) — คืน <mark> ตัวแรกไว้เลื่อนจอไปหา */
function highlightQuery(root, q) {
  if (!q || !q.trim()) return null;
  const needle = q.toLowerCase();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.nodeValue.toLowerCase().includes(needle)) nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, lower = text.toLowerCase();
    const frag = document.createDocumentFragment();
    let i = 0, at;
    while ((at = lower.indexOf(needle, i)) !== -1) {
      frag.append(text.slice(i, at));
      const m = document.createElement('mark');
      m.className = 'search-hit';
      m.textContent = text.slice(at, at + q.length);
      frag.append(m);
      i = at + q.length;
    }
    frag.append(text.slice(i));
    node.replaceWith(frag);
  });
  return root.querySelector('mark.search-hit');
}

// แปลง GitHub-style callout (> [!NOTE] ฯลฯ) เป็นกล่อง note/tip/warning
function convertCallouts(root) {
  const map = { NOTE: 'note', TIP: 'tip', WARNING: 'warning', IMPORTANT: 'note', CAUTION: 'warning' };
  root.querySelectorAll('blockquote').forEach(bq => {
    const p = bq.querySelector('p');
    const m = p && p.textContent.match(/^\[!(NOTE|TIP|WARNING|IMPORTANT|CAUTION)\]/i);
    if (!m) return;
    p.innerHTML = p.innerHTML.replace(/^\[!\w+\]\s*(<br\s*\/?>\s*)?/i, '');
    if (!p.textContent.trim() && !p.querySelector('*')) p.remove();
    const div = document.createElement('div');
    div.className = map[m[1].toUpperCase()];
    div.innerHTML = bq.innerHTML;
    bq.replaceWith(div);
  });
}

function renderToc() {
  const done = doneSet();
  $('tocList').innerHTML = book.chapters.map((c, i) => `
    <li><a href="${chapterUrl(i + 1)}" class="${i + 1 === ch ? 'current' : ''}">
      <span class="num">${i + 1}</span>
      <span>${esc(c.title)}</span>
      ${done.has(i + 1) ? '<span class="done">✓</span>' : ''}
    </a></li>`).join('');
}

function renderNav() {
  const total = book.chapters.length;
  if (paged()) {
    $('prevBtn').textContent = '‹ หน้าก่อน';
    $('nextBtn').textContent = 'หน้าถัดไป ›';
    $('prevBtn').onclick = () => flipPage(-1);
    $('nextBtn').onclick = () => flipPage(1);
    updatePagedUI();
  } else {
    $('prevBtn').textContent = '‹ บทก่อนหน้า';
    $('nextBtn').textContent = 'บทถัดไป ›';
    $('posBtn').textContent = `บทที่ ${ch}/${total}`;
    $('prevBtn').disabled = ch <= 1;
    $('nextBtn').disabled = ch >= total;
    $('prevBtn').onclick = () => navTo(ch - 1);
    $('nextBtn').onclick = () => navTo(ch + 1);
  }
}

addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft') paged() ? flipPage(-1) : navTo(ch - 1);
  if (e.key === 'ArrowRight') paged() ? flipPage(1) : navTo(ch + 1);
});

/* ---------- โหมดพลิกหน้าแบบ ebook (แบ่งเนื้อหาเป็นหน้าพอดีจอ) ---------- */

const PAGE_GAP = 48;
let mode = localStorage.getItem('ebook:readMode') || 'page';
let page = 0, pages = 1, pageW = 0, pageH = 0, colW = 0, cols = 1;
const paged = () => mode === 'page';
document.body.classList.toggle('paged', paged());

const pageRatio = () => (pages > 1 ? page / (pages - 1) : 1);
const pageAnimOn = () => localStorage.getItem('ebook:pageAnim') !== '0'
  && !matchMedia('(prefers-reduced-motion: reduce)').matches;

/* วัดพื้นที่อ่านแล้วให้เนื้อหาไหลเป็นคอลัมน์ = หน้ากระดาษ
   จอกว้าง (แท็บเล็ตแนวนอน/คอม) ใช้ 2 คอลัมน์ต่อหนึ่งหน้า เหมือนหนังสือกางออก */
const step = () => cols * (colW + PAGE_GAP);

function layoutPages(ratio) {
  if (!paged()) return;
  const c = $('content');
  if (ratio == null) ratio = pageRatio();
  c.style.columnWidth = c.style.columnGap = '';
  pageW = c.clientWidth;
  pageH = c.clientHeight;
  cols = pageW >= 860 ? 2 : 1;
  colW = Math.floor((pageW - (cols - 1) * PAGE_GAP) / cols);
  c.style.columnWidth = colW + 'px';
  c.style.columnGap = PAGE_GAP + 'px';
  const totalCols = Math.max(1, Math.round((c.scrollWidth + PAGE_GAP) / (colW + PAGE_GAP)));
  pages = Math.max(1, Math.ceil(totalCols / cols));
  page = Math.min(pages - 1, Math.max(0, Math.round(ratio * (pages - 1))));
  jumpTo(page);
  buildLeaf();
  updatePagedUI();
}

function jumpTo(p) {
  $('content').style.transform = `translateX(${-p * step()}px)`;
}

/* ใบกระดาษสำหรับอนิเมชันพลิก — สำเนาเนื้อหาชุดเดียว ใช้ซ้ำทุกครั้งที่พลิก
   (ไม่สำเนาแยกรายหน้า ซึ่งทำให้ DOM บวมจนกระตุก) */
let leafEl = null, leafInner = null, leafShade = null, leafAnim = null;
let contentStamp = 0, leafStamp = -1;
const markContentChanged = () => { contentStamp++; };

function buildLeaf() {
  const c = $('content');
  if (!leafEl) {
    leafEl = document.createElement('div');
    leafEl.className = 'flip-leaf';
    leafInner = document.createElement('div');
    leafInner.className = 'content flip-leaf-inner';
    leafShade = document.createElement('div');
    leafShade.className = 'flip-leaf-shade';
    leafEl.append(leafInner, leafShade);
    document.querySelector('.reader-main').appendChild(leafEl);
  }
  finishLeaf();
  const main = document.querySelector('.reader-main');
  const cr = c.getBoundingClientRect(), mr = main.getBoundingClientRect();
  leafEl.style.left = (cr.left - mr.left) + 'px';
  leafEl.style.top = (cr.top - mr.top) + 'px';
  leafEl.style.width = pageW + 'px';
  leafEl.style.height = pageH + 'px';
  leafInner.style.cssText =
    `width:${pageW}px;height:${pageH}px;column-width:${colW}px;column-gap:${PAGE_GAP}px;column-fill:auto`;
  if (leafStamp !== contentStamp) { // สำเนาใหม่เฉพาะตอนเนื้อหาเปลี่ยนจริง
    leafInner.innerHTML = c.innerHTML;
    leafStamp = contentStamp;
  }
  leafEl.style.display = 'none';
}

const FLIP_MS = 420;
function setPage(n, animate = true) {
  const from = page;
  const to = Math.min(Math.max(0, n), pages - 1);
  page = to;
  if (to !== from) {
    // พลิกทีละหน้าเท่านั้นที่ใช้อนิเมชัน — กระโดดข้ามหลายหน้า (สารบัญ/ค้นหา) ตัดไปเลย
    if (animate && pageAnimOn() && leafEl && Math.abs(to - from) === 1) runFlip(from, to);
    else { finishLeaf(); jumpTo(to); }
  }
  updatePagedUI();
}

/* งานปิดท้ายของใบที่กำลังพลิก — เก็บไว้เรียกเองได้ ถ้าผู้ใช้พลิกรัวจนใบก่อนยังไม่ทันจบ
   (ปล่อยให้อนิเมชันซ้อนกันคือที่มาของอาการกระพริบ/กระตุก) */
let leafDone = null;
function finishLeaf() {
  const fn = leafDone;
  leafDone = null;
  if (fn) fn();
}

function runFlip(from, to) {
  finishLeaf();
  [leafEl, leafShade].forEach(el => el.getAnimations().forEach(a => a.cancel()));

  const fwd = to > from;
  leafInner.style.transform = `translateX(${-(fwd ? from : to) * step()}px)`;
  leafEl.style.display = 'block';
  jumpTo(fwd ? to : from); // ใบกระดาษบังอยู่ ข้างล่างสลับหน้าได้ทันทีโดยไม่เห็น

  const opts = { duration: FLIP_MS, easing: 'cubic-bezier(0.32, 0.08, 0.24, 1)', fill: 'forwards' };
  const turn = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-176deg)' }];
  const shade = [{ opacity: 0 }, { opacity: 0.5 }];
  const anim = leafEl.animate(fwd ? turn : [...turn].reverse(), opts);
  leafShade.animate(fwd ? shade : [...shade].reverse(), { ...opts, easing: 'linear' });

  leafDone = () => {
    if (!fwd) jumpTo(to); // ย้อนกลับ: ใบลงมาปิดจอแล้วค่อยสลับหน้าข้างล่างให้ตรงกัน
    leafEl.style.display = 'none';
  };
  anim.onfinish = finishLeaf;
}

let posSaveTimer = null;
function updatePagedUI() {
  if (!paged() || !book) return;
  const r = pageRatio();
  $('readProgress').style.width = (r * 100) + '%';
  if (ready) {
    if (r >= 0.9) markDone();
    clearTimeout(posSaveTimer);
    posSaveTimer = setTimeout(() => localStorage.setItem(keyPos(), r.toFixed(4)), 250);
  }
  $('posBtn').textContent = `บทที่ ${ch}/${book.chapters.length} · หน้า ${page + 1}/${pages}`;
  $('prevBtn').disabled = ch <= 1 && page <= 0;
  $('nextBtn').disabled = ch >= book.chapters.length && page >= pages - 1;
}

// พลิกทีละหน้า — สุดบทแล้วไหลข้ามไปบทถัดไป/ก่อนหน้าให้เอง
function flipPage(dir) {
  if (!paged() || navBusy || !book) return;
  if (dir > 0 && page >= pages - 1) return navTo(ch + 1, { entry: 'start' });
  if (dir < 0 && page <= 0) return navTo(ch - 1, { entry: 'end' });
  setPage(page + dir);
}

function applyMode() {
  document.body.classList.toggle('paged', paged());
  const c = $('content');
  const saved = parseFloat(localStorage.getItem(keyPos()));
  if (paged()) {
    layoutPages(saved > 0 && saved <= 1 ? saved : 0);
  } else {
    finishLeaf();
    if (leafEl) leafEl.style.display = 'none';
    c.style.columnWidth = c.style.columnGap = c.style.transform = '';
    pages = 1; page = 0;
    requestAnimationFrame(() => {
      const el = document.scrollingElement;
      el.scrollTop = (saved > 0.01 && saved < 0.99) ? saved * (el.scrollHeight - el.clientHeight) : 0;
    });
  }
}

// จัดหน้าใหม่เมื่อ layout เปลี่ยน (หมุนจอ, ปรับฟอนต์, รูป/แผนภาพเพิ่งโหลดเสร็จ)
let relayoutTimer = null;
function relayout() {
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(() => layoutPages(), 150);
}
addEventListener('resize', relayout);

// แตะฝั่งซ้าย/ขวาของจอเพื่อพลิกหน้า (โซนกว้าง 30% ให้กดง่ายบนแท็บเล็ต)
document.querySelector('.reader-main').addEventListener('click', e => {
  if (!paged() || navBusy) return;
  if (e.target.closest('a, button, input, textarea, .table-wrap, pre, .mermaid-box')) return;
  if (String(getSelection())) return; // กำลังลากเลือกข้อความ ไม่ใช่การแตะเปลี่ยนหน้า
  const x = e.clientX / innerWidth;
  if (x < 0.3) flipPage(-1);
  else if (x > 0.7) flipPage(1);
});

/* ---------- เปลี่ยนบทแบบไม่ reload หน้า ---------- */

function animateClass(el, cls) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (done) return; done = true; el.classList.remove(cls); resolve(); };
    el.addEventListener('animationend', finish, { once: true });
    setTimeout(finish, 450); // กันค้างถ้า animationend ไม่ยิง
    el.classList.add(cls);
  });
}

let navBusy = false;
async function navTo(n, { push = true, entry = 'auto' } = {}) {
  if (navBusy || !book || !(n >= 1 && n <= book.chapters.length) || n === ch) return;
  navBusy = true;
  const dir = n > ch ? 1 : -1;
  if (ready) localStorage.setItem(keyPos(), (paged() ? pageRatio() : scrollRatio()).toFixed(4));
  ready = false;
  toggleDrawer(false);

  // โหมดเลื่อน: อนิเมชันพลิกทั้งบทแบบ 3D / โหมดแบ่งหน้า: fade สั้น ๆ
  // (rotateY ใช้กับโหมดแบ่งหน้าไม่ได้ เพราะ keyframe จะทับ translateX ของหน้า)
  const anim = pageAnimOn();
  const animEl = $('content');
  const outCls = paged() ? 'page-fade-out' : (dir > 0 ? 'turn-out-next' : 'turn-out-prev');
  const inCls = paged() ? 'page-fade-in' : (dir > 0 ? 'turn-in-next' : 'turn-in-prev');
  if (anim) await animateClass(animEl, outCls);
  if (push) history.pushState(null, '', chapterUrl(n));
  await renderChapter(n, null, entry);
  if (anim) await animateClass(animEl, inCls);
  navBusy = false;
}

// ปุ่ม back/forward ของเบราว์เซอร์
addEventListener('popstate', () => {
  const n = parseInt(new URLSearchParams(location.search).get('ch'), 10) || 1;
  navTo(n, { push: false });
});

// ลิงก์ทุกอันที่ชี้บทในเล่มเดียวกัน (สารบัญ drawer + ลิงก์ข้ามบทในเนื้อหา) → เปลี่ยนบทในหน้าเลย
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const m = a.getAttribute('href').match(/^reader\.html\?book=([^&]+)&ch=(\d+)$/);
  if (!m || decodeURIComponent(m[1]) !== bookId) return;
  e.preventDefault();
  navTo(parseInt(m[2], 10));
});

// ปัดซ้าย/ขวาเพื่อพลิกบท (มือถือ/แท็บเล็ต) — ไม่ชนกับการเลื่อนอ่านแนวตั้ง
// และไม่ทำงานถ้าปัดในตาราง/แผนภาพ/โค้ดที่เลื่อนแนวนอนได้เอง
let swipeStart = null;
addEventListener('touchstart', e => {
  // โหมดพลิกหน้า: StPageFlip รับ gesture เอง — อย่าจับซ้ำ เดี๋ยวพลิกทีเดียวสองหน้า
  swipeStart = (e.touches.length === 1 &&
    !document.body.classList.contains('drawer-open') &&
    !e.target.closest('.table-wrap, .mermaid-box, pre'))
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }
    : null;
}, { passive: true });
addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  const dt = Date.now() - swipeStart.t;
  swipeStart = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || dt > 600) return;
  // ปัดซ้าย = ไปข้างหน้า (เหมือนพลิกหนังสือ) — โหมดแบ่งหน้าพลิกทีละหน้า, โหมดเลื่อนข้ามทีละบท
  const dir = dx < 0 ? 1 : -1;
  paged() ? flipPage(dir) : navTo(ch + dir);
}, { passive: true });

// สลับโหมดได้ 2 ที่: ปุ่ม 📄/📜 บน topbar และสวิตช์ใน drawer — ใช้ logic เดียวกัน
function setMode(m) {
  if (m === mode) return;
  if (ready) localStorage.setItem(keyPos(), (paged() ? pageRatio() : scrollRatio()).toFixed(4));
  mode = m;
  localStorage.setItem('ebook:readMode', mode);
  applyMode();
  if (book) renderNav();
  syncModeUI();
}
function syncModeUI() {
  $('modeToggle').checked = paged();
  $('modeBtn').innerHTML = paged()
    ? '📄<span class="btn-label"> พลิกหน้า</span>'
    : '📜<span class="btn-label"> เลื่อนอ่าน</span>';
  $('modeBtn').title = paged()
    ? 'กำลังอ่านแบบพลิกหน้า — แตะเพื่อสลับเป็นเลื่อนแนวตั้ง'
    : 'กำลังอ่านแบบเลื่อนแนวตั้ง — แตะเพื่อสลับเป็นพลิกหน้า';
}
syncModeUI();
$('modeBtn').addEventListener('click', () => setMode(paged() ? 'scroll' : 'page'));
$('modeToggle').addEventListener('change', () => setMode($('modeToggle').checked ? 'page' : 'scroll'));

$('animToggle').checked = localStorage.getItem('ebook:pageAnim') !== '0';
$('animToggle').addEventListener('change', () => {
  localStorage.setItem('ebook:pageAnim', $('animToggle').checked ? '1' : '0');
});

async function load() {
  const content = $('content');
  let books;
  try {
    books = await loadCatalog();
  } catch (e) {
    content.innerHTML = `<div class="content-error">โหลด <code>books.html</code> ไม่สำเร็จ —
      ต้องเปิดผ่านเซิร์ฟเวอร์ เช่น <code>python3 -m http.server 8000</code></div>`;
    return;
  }

  book = books.find(b => b.id === bookId);
  if (!book || !book.chapters.length) {
    content.innerHTML = `<div class="content-error">ไม่พบหนังสือ "${esc(bookId)}" ใน books.html</div>`;
    return;
  }

  let n = parseInt(params.get('ch'), 10);
  if (!(n >= 1 && n <= book.chapters.length)) n = 1;
  await renderChapter(n, params.get('q'));
}

async function renderChapter(n, q, entry = 'auto') {
  const content = $('content');
  ch = n;
  localStorage.setItem('ebook:last:' + bookId, ch);
  localStorage.setItem('ebook:lastOpen:' + bookId, Date.now()); // ให้หน้าชั้นรู้ว่าเล่มไหนเปิดล่าสุดจริง ๆ

  const chapter = book.chapters[ch - 1];
  document.title = `${chapter.title} — ${book.title}`;
  $('barTitle').innerHTML = `${esc(chapter.title)}<small>${esc(book.title)}</small>`;
  renderToc();
  renderNav();

  let raw;
  try {
    const res = await fetch(chapter.path, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    raw = await res.text();
  } catch (e) {
    content.innerHTML = `<div class="content-error">โหลดไฟล์ <code>${esc(chapter.path)}</code> ไม่สำเร็จ</div>`;
    return;
  }

  let math = [];
  if (/\.md([?#].*)?$/i.test(chapter.path)) {
    // ไฟล์ markdown — ดึงสูตรคณิตออกก่อน แล้วแปลงเป็น HTML ด้วย marked
    const ex = extractMath(raw);
    math = ex.found;
    content.innerHTML = marked.parse(ex.out);
    convertCallouts(content);
  } else {
    // ไฟล์ HTML — รองรับทั้งไฟล์เต็ม (เอาเฉพาะ body) และ fragment
    const doc = new DOMParser().parseFromString(raw, 'text/html');
    content.innerHTML = doc.body.innerHTML;
  }
  stripForeignStyles(content);

  // ```mermaid (หรือ <pre class="mermaid">) → กล่องแผนภาพ วาดแบบ lazy ทีหลัง
  content.querySelectorAll('code.language-mermaid, pre.mermaid, div.mermaid').forEach(el => {
    const box = document.createElement('div');
    box.className = 'mermaid-box';
    box.dataset.src = el.textContent;
    box.textContent = '⏳ กำลังวาดแผนภาพ…';
    (el.closest('pre') || el).replaceWith(box);
  });

  // ตารางกว้าง ๆ ให้เลื่อนแนวนอนได้ในกรอบตัวเอง
  content.querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('table-wrap')) return;
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.before(w);
    w.append(t);
  });

  // ลิงก์ข้ามบทแบบ relative (เช่นจากไฟล์สารบัญ: [บทที่ 5](05-attention.md))
  // → เปิดบทนั้นผ่าน reader แทนที่จะ 404
  const chapterNo = new Map(book.chapters.map((c, i) => {
    const base = c.file || decodeURIComponent((c.path || '').split(/[?#]/)[0].split('/').pop());
    return [base, i + 1];
  }));
  content.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href || /^[a-z][a-z0-9+.-]*:|^[/#]/i.test(href)) return; // URL เต็ม, /path, #anchor — ไม่แตะ
    const base = decodeURIComponent(href.split(/[?#]/)[0].split('/').pop());
    const n = chapterNo.get(base);
    if (n) a.setAttribute('href', chapterUrl(n));
  });

  // ลิงก์ออกนอกให้เปิดแท็บใหม่
  content.querySelectorAll('a[href^="http"]').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener';
  });

  // สูตรคณิต + สีโค้ด รอให้เสร็จก่อนคืนตำแหน่งอ่าน (เร็ว, ไฟล์เล็ก)
  // ส่วน mermaid หนักกว่ามาก ปล่อยวาดตามหลัง แล้วค่อยจัดหน้าใหม่เมื่อวาดเสร็จ
  await Promise.all([renderMath(content, math), highlightCode(content)]);
  renderMermaid(content).then(() => { markContentChanged(); relayout(); });
  content.querySelectorAll('img').forEach(img => {
    if (!img.complete) img.addEventListener('load', relayout, { once: true });
  });

  // ถ้ามาจากหน้าค้นหา (?q=) ไฮไลต์คำแล้วพาไปจุดแรกที่เจอ ไม่งั้นคืนตำแหน่งอ่านล่าสุด
  const firstHit = highlightQuery(content, q);
  markContentChanged();
  const saved = parseFloat(localStorage.getItem(keyPos()));
  requestAnimationFrame(() => {
    if (paged()) {
      document.scrollingElement.scrollTop = 0;
      let r = 0;
      if (entry === 'end') r = 1;
      else if (entry === 'auto' && saved > 0 && saved <= 1) r = saved;
      layoutPages(r);
      if (firstHit) {
        // กระโดดไปหน้าที่คำค้นอยู่ (ระยะ x ในคอลัมน์ → หมายเลขหน้า)
        const dx = firstHit.getBoundingClientRect().left - content.getBoundingClientRect().left;
        setPage(Math.floor(dx / step()), false);
      }
    } else if (firstHit) {
      firstHit.scrollIntoView({ block: 'center' });
    } else if (entry === 'auto' && saved > 0.01 && saved < 0.99) {
      const el = document.scrollingElement;
      el.scrollTop = saved * (el.scrollHeight - el.clientHeight);
    } else {
      document.scrollingElement.scrollTop = 0; // บทใหม่เริ่มบนสุด (สำคัญตอนสลับบทแบบไม่ reload)
    }
    ready = true;
    paged() ? updatePagedUI() : onScroll();
  });
}

load();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
